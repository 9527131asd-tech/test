<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>校园智能实验室</title><link rel="stylesheet" href="/style.css"></head>
<body><header><div><small>校园实验室资源管理平台</small><h1>智能实验室</h1></div><div class="login"><input id="username" placeholder="账号" value="student01"><input id="password" type="password" placeholder="密码"><button id="login">登录</button><span id="who"></span></div></header>
<main><nav><button data-view="overview" class="active">资源总览</button><button data-view="reserve">预约实验室</button><button data-view="repair">设备报修</button><button data-view="stock">耗材库存</button><button data-view="mine">我的记录</button></nav>
<section id="overview" class="view"><div class="intro"><div><p class="eyebrow">LAB RESOURCE CENTER</p><h2>让实验资源安排更清楚</h2><p>查询开放实验室、选择设备与时段，在线完成预约和报修。</p></div><div class="stats" id="stats"></div></div><h3>可预约实验室</h3><div id="labs" class="grid"></div></section>
<section id="reserve" class="view hidden"><h2>预约实验室</h2><form id="booking" class="panel"><label>实验室<select id="labSelect" required></select></label><label>开始时间<input id="start" type="datetime-local" required></label><label>结束时间<input id="end" type="datetime-local" required></label><label>设备（可多选）<select id="equipment" multiple size="4"></select></label><button>提交预约</button></form><p class="hint">学生每次可预约 1 个实验室和最多 3 台设备，时长不超过 4 小时；教师上限为 8 小时。</p></section>
<section id="repair" class="view hidden"><h2>提交设备报修</h2><form id="repairForm" class="panel"><label>设备<select id="repairEquipment" required></select></label><label>故障描述<textarea id="description" required rows="4" placeholder="请描述故障现象和发生时间"></textarea></label><label>故障图片链接（可选）<input id="image" type="url" placeholder="https://..."></label><button>提交报修单</button></form></section>
<section id="stock" class="view hidden"><h2>耗材库存</h2><div id="consumables" class="grid"></div><form id="issueForm" class="panel"><label>选择耗材<select id="consumableSelect"></select></label><label>领用数量<input id="quantity" type="number" min="1" value="1"></label><button>申请领用</button></form></section>
<section id="mine" class="view hidden"><h2>我的预约</h2><div id="reservations" class="list"></div><h2>我的报修</h2><div id="repairs" class="list"></div><h2>实验报告</h2><form id="reportForm" class="panel"><label>报告标题<input id="reportTitle" required></label><label>实验室<select id="reportLab"></select></label><label>选择报告文件（PDF/DOC/DOCX）<input id="reportFile" type="file" accept=".pdf,.doc,.docx" required></label><button>上传并提交报告</button></form><div id="reports" class="list"></div></section>
</main><div id="toast" role="status"></div><script src="/app.js"></script></body></html>
