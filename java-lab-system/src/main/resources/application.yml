server:
  port: 8080
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/campus_lab?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USER:lab}
    password: ${DB_PASSWORD:labpass}
  sql:
    init:
      mode: always
      encoding: UTF-8
  jackson:
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB
