services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: campus_lab
      MYSQL_USER: lab
      MYSQL_PASSWORD: ${DB_PASSWORD:-labpass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      TZ: Asia/Shanghai
    volumes: ["lab-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    depends_on:
      mysql: {condition: service_healthy}
    environment:
      DB_URL: jdbc:mysql://mysql:3306/campus_lab?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USER: lab
      DB_PASSWORD: ${DB_PASSWORD:-labpass}
      TZ: Asia/Shanghai
    ports: ["8080:8080"]
volumes:
  lab-data:
